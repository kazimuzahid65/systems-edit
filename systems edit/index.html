<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Systems Edit — Legal Practice Systems, Edited</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbfaf7;--bg2:#f0eee8;--ink:#0e1c38;--mut:#5b6578;--navy:#0e1c38;--gold:#c28f2c;--line:#d9d6cc;--card:#fff;--on:#fff}
[data-theme=dark]{--bg:#0a1429;--bg2:#101d3a;--ink:#f1eee6;--mut:#a3adc2;--navy:#060d1d;--line:#25335a;--card:#13234a}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth;scroll-padding-top:90px}
body{font:400 16px/1.7 Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink);transition:background .4s,color .4s}
h1,h2,h3,h4{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;line-height:1.1;letter-spacing:-.01em}
h1{font-size:clamp(2.8rem,7vw,5.6rem)}h2{font-size:clamp(2rem,4vw,3.2rem)}h3{font-size:1.6rem}
a{color:inherit}.w{max-width:1180px;margin:auto;padding:0 24px}.sec{padding:96px 0}.alt{background:var(--bg2)}
.mut{color:var(--mut)}.it{font-style:italic;color:var(--gold)}
.btn{display:inline-block;padding:14px 30px;background:var(--gold);color:#1a1202;font-weight:700;font-size:.9rem;text-decoration:none;border:1px solid var(--gold);cursor:pointer;position:relative;overflow:hidden;transition:.35s;font-family:inherit}
.btn::after{content:"→";position:absolute;right:-20px;opacity:0;transition:.35s}.btn:hover{padding-right:44px;padding-left:20px;background:var(--navy);color:#fff;border-color:var(--navy)}.btn:hover::after{right:18px;opacity:1}
.btn.o{background:none;color:inherit;border-color:currentColor}.btn.o:hover{background:var(--ink);color:var(--bg)}
header{position:fixed;inset:0 0 auto;z-index:50;transition:.4s;border-bottom:1px solid transparent}
header.s{background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-color:var(--line)}
nav{display:flex;align-items:center;gap:6px;height:76px}.logo{font:600 1.55rem 'Cormorant Garamond',serif;text-decoration:none;margin-right:auto;display:flex;gap:10px;align-items:center}
.logo i{width:30px;height:30px;border:1.5px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-size:.8rem;color:var(--gold);font-style:normal}
.nl{position:relative}.nl>a{display:block;padding:8px 14px;text-decoration:none;font-size:.92rem;font-weight:500;position:relative}
.nl>a::after{content:"";position:absolute;left:14px;right:14px;bottom:2px;height:1px;background:var(--gold);transform:scaleX(0);transition:.3s}.nl:hover>a::after,.nl>a.on::after{transform:scaleX(1)}
.dd{position:absolute;top:100%;left:-10px;min-width:290px;background:var(--card);border:1px solid var(--line);padding:14px;opacity:0;visibility:hidden;transform:translateY(10px);transition:.3s;box-shadow:0 24px 50px -20px #0005}
.nl:hover .dd,.nl:focus-within .dd{opacity:1;visibility:visible;transform:none}.dd b{display:block;font:600 1.05rem 'Cormorant Garamond',serif;color:var(--gold);margin:8px 8px 2px}
.dd a{display:block;padding:7px 8px;text-decoration:none;font-size:.9rem;transition:.25s}.dd a:hover{background:var(--bg2);padding-left:16px}
.tg{width:46px;height:26px;border-radius:20px;border:1px solid var(--line);background:var(--bg2);cursor:pointer;position:relative;margin:0 10px}
.tg::after{content:"☀";position:absolute;top:2px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--gold);font-size:12px;display:grid;place-items:center;transition:.35s;color:#fff}[data-theme=dark] .tg::after{left:23px;content:"☾"}
.ed{font:700 .75rem Manrope;padding:6px 12px;border:1px solid var(--line);background:none;color:inherit;cursor:pointer;margin-right:8px}.ed.on{background:var(--gold);color:#000}
.bg{display:none;background:none;border:0;font-size:1.6rem;color:inherit;cursor:pointer}
.hero{min-height:100vh;background:var(--navy);color:#fff;display:flex;align-items:center;position:relative;overflow:hidden;padding:120px 0 80px}
.hero .g{display:grid;grid-template-columns:1.25fr 1fr;gap:60px;align-items:center}.hero p.d{font:italic 500 1.3rem 'Cormorant Garamond',serif;color:var(--gold);margin-bottom:18px}
.hero h1{margin-bottom:28px}.hero .lead{max-width:520px;color:#c3cbe0;margin-bottom:36px}.hero .btns{display:flex;gap:14px;flex-wrap:wrap}
.arch{aspect-ratio:3/4;border-radius:999px 999px 8px 8px;overflow:hidden;border:1px solid #c28f2c88;padding:12px;animation:rise 1.4s cubic-bezier(.2,.8,.2,1) both}
.arch img{width:100%;height:100%;object-fit:cover;border-radius:999px 999px 4px 4px;transition:transform 1.2s}.arch:hover img{transform:scale(1.06)}
@keyframes rise{from{opacity:0;transform:translateY(50px)}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #ffffff30;margin-top:70px}.stats div{padding:22px 0}.stats b{font:600 2.4rem 'Cormorant Garamond',serif;color:var(--gold);display:block}.stats span{font-size:.85rem;color:#aab4cd}
.ph{padding:150px 0 70px;background:var(--navy);color:#fff}.ph p{color:#b9c2da;max-width:620px;margin-top:16px}.ph hr{width:60px;border:0;border-top:2px solid var(--gold);margin-top:26px}
.row{display:grid;gap:28px}.c3{grid-template-columns:repeat(3,1fr)}.c2{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);padding:38px 32px;transition:.4s;position:relative}.card:hover{transform:translateY(-8px);border-color:var(--gold);box-shadow:0 30px 60px -30px #0007}
.card .ic{width:64px;height:64px;margin-bottom:22px}.card h3{margin-bottom:10px}.card ul{padding-left:18px;margin:14px 0;color:var(--mut);font-size:.93rem}
.lk{font-weight:700;text-decoration:none;border-bottom:1px solid var(--gold);padding-bottom:2px;font-size:.92rem;transition:.3s}.lk:hover{color:var(--gold);letter-spacing:.03em}
.sh{max-width:640px;margin-bottom:54px}.sh p{margin-top:14px;color:var(--mut)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center}.pic{overflow:hidden;border-radius:6px}.pic img{width:100%;display:block;transition:transform 1s}.pic:hover img{transform:scale(1.05)}
.plat{display:flex;flex-wrap:wrap;gap:14px}.plat span{padding:14px 28px;border:1px solid var(--line);font:600 1.3rem 'Cormorant Garamond',serif;transition:.3s;cursor:default;background:var(--card)}.plat span:hover{background:var(--gold);color:#111;transform:rotate(-2deg) scale(1.05)}
.steps{counter-reset:s;display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--line)}.steps div{padding:30px 24px 10px 0;counter-increment:s}.steps div::before{content:counter(s);font:italic 600 3rem 'Cormorant Garamond',serif;color:var(--gold);display:block;line-height:1}
.mq{overflow:hidden;padding:10px 0;mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}.tr{display:flex;gap:24px;width:max-content;animation:mq 45s linear infinite}.mq:hover .tr{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
.rv{width:380px;flex:none;background:var(--card);border:1px solid var(--line);padding:30px;cursor:pointer;transition:.35s}.rv:hover{border-color:var(--gold);transform:translateY(-6px)}
.rv q{display:block;font:500 1.25rem/1.4 'Cormorant Garamond',serif;margin:10px 0 18px;quotes:none;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.st{color:var(--gold);letter-spacing:3px}
.band{background:var(--gold);color:#1a1202;text-align:center;padding:90px 0}.band .btn{background:var(--navy);color:#fff;border-color:var(--navy);margin-top:26px}.band .btn:hover{background:#fff;color:#000;border-color:#fff}
.cta{position:relative;background:var(--navy);color:#fff;padding:70px;display:flex;gap:30px;justify-content:space-between;align-items:center;flex-wrap:wrap;overflow:hidden}.cta::before{content:"";position:absolute;right:-80px;top:-80px;width:320px;height:320px;border:1px solid #c28f2c66;border-radius:50%;transition:.8s}.cta:hover::before{transform:scale(1.5)}
.cta>*{position:relative}.cta h2{max-width:640px}
.fq{border-bottom:1px solid var(--line)}.fq button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:20px;width:100%;padding:22px 0;font:600 1.3rem 'Cormorant Garamond',serif}.fq button:hover{color:var(--gold)}.fq i{transition:.3s;font-style:normal;color:var(--gold)}.fq.o i{transform:rotate(45deg)}
.fq div{max-height:0;overflow:hidden;transition:max-height .5s;color:var(--mut)}.fq.o div{max-height:400px;padding-bottom:22px}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:30px}.chips button{padding:8px 20px;border:1px solid var(--line);background:none;color:inherit;cursor:pointer;font:inherit;font-size:.88rem;transition:.3s}.chips button:hover,.chips .on{background:var(--ink);color:var(--bg)}
.svc{display:grid;grid-template-columns:240px 1fr auto;gap:40px;padding:42px 0;border-bottom:1px solid var(--line);align-items:start}.svc small{color:var(--gold);font-weight:700}
.svc:hover h3{color:var(--gold)}.svc h3{transition:.3s}
.bk{display:grid;grid-template-columns:1fr 1fr;gap:40px}.cal{background:var(--card);border:1px solid var(--line);padding:26px}.cal header{all:unset;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font:600 1.4rem 'Cormorant Garamond',serif}
.cal header button,.sl button{background:none;border:1px solid var(--line);color:inherit;cursor:pointer;padding:6px 12px;transition:.3s}.cal header button:hover{background:var(--gold)}
.dg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}.dg b{font-size:.72rem;color:var(--mut)}.dg button{aspect-ratio:1;border:0;background:none;color:var(--mut);font:inherit}.dg .av{background:var(--bg2);color:var(--ink);font-weight:700;cursor:pointer;transition:.25s}.dg .av:hover,.dg .sel{background:var(--gold);color:#111;transform:scale(1.1)}
.sl{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.sl .sel{background:var(--navy);color:#fff}
input,select,textarea{width:100%;padding:13px 14px;border:1px solid var(--line);background:var(--card);color:inherit;font:inherit;margin-bottom:12px;transition:.3s}input:focus,textarea:focus,select:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 3px #c28f2c33}
.doc{max-width:820px}.doc h4{font-size:1.5rem;margin:34px 0 6px}.doc p{color:var(--mut);margin-bottom:8px}
footer{background:var(--navy);color:#c9d0e2;padding:80px 0 30px}footer .f{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:40px}footer h4{color:#fff;font-size:1.3rem;margin-bottom:14px}footer a{display:block;text-decoration:none;padding:3px 0;font-size:.92rem;transition:.25s}footer a:hover{color:var(--gold);padding-left:6px}
.soc{display:flex;gap:10px;margin-top:16px}.soc a{width:40px;height:40px;border:1px solid #ffffff40;border-radius:50%;display:grid;place-items:center;padding:0;font-size:.8rem;font-weight:700}.soc a:hover{background:var(--gold);color:#111;transform:translateY(-4px);padding:0}
.cp{border-top:1px solid #ffffff20;margin-top:50px;padding-top:22px;font-size:.8rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
.md{position:fixed;inset:0;background:#050b1acc;z-index:99;display:none;place-items:center;padding:20px;backdrop-filter:blur(4px)}.md.o{display:grid}.mb{background:var(--card);max-width:620px;width:100%;padding:48px;position:relative;animation:pop .4s cubic-bezier(.2,.9,.3,1.2)}@keyframes pop{from{transform:scale(.88);opacity:0}}
.mb q{font:500 1.7rem/1.4 'Cormorant Garamond',serif;display:block;margin:14px 0;quotes:none}.x{position:absolute;top:14px;right:18px;background:none;border:0;font-size:2rem;color:inherit;cursor:pointer;transition:.3s}.x:hover{transform:rotate(90deg);color:var(--gold)}
.rev{opacity:0;transform:translateY(26px);transition:1s cubic-bezier(.2,.8,.2,1)}.rev.in{opacity:1;transform:none}
[contenteditable=true]{outline:1px dashed var(--gold);outline-offset:4px}
header{color:#fff}header.s{color:var(--ink)}.dd{color:var(--ink)}header:not(.s) .tg{border-color:#ffffff55;background:#ffffff1a}
.nl>a{overflow:hidden;transition:color .3s,transform .2s}.nl>a.on{color:var(--gold)}.nl>a:active{transform:scale(.92)}
.rp{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--gold);opacity:.6;transform:scale(0);animation:rp .65s ease-out;pointer-events:none}@keyframes rp{to{transform:scale(16);opacity:0}}
#app.pf{animation:pf .7s cubic-bezier(.2,.8,.2,1)}@keyframes pf{from{opacity:0;transform:translateY(14px)}}
.soc svg{width:18px;height:18px}
.bc{display:flex;flex-direction:column;text-decoration:none;background:var(--card);border:1px solid var(--line);transition:.4s;overflow:hidden}.bc:hover{transform:translateY(-8px);border-color:var(--gold);box-shadow:0 30px 60px -30px #0007}.bc .pic{border-radius:0}.bc .t{padding:26px}.bc small{color:var(--gold);font-weight:700}.bc h3{margin:6px 0 8px;transition:.3s}.bc:hover h3{color:var(--gold)}
.art{max-width:720px;margin:auto}.art p{margin-bottom:20px;font-size:1.08rem;line-height:1.85;color:var(--mut)}.art p:first-of-type::first-letter{font:600 4rem/.8 'Cormorant Garamond',serif;float:left;padding:6px 10px 0 0;color:var(--gold)}
.chips a{padding:8px 20px;border:1px solid var(--line);text-decoration:none;font-size:.88rem;transition:.3s}.chips a:hover,.chips a.on{background:var(--ink);color:var(--bg)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@media(max-width:900px){.bg{display:block}.nl,.ed{display:none}nav.m .nl{display:block}nav.m{flex-wrap:wrap;height:auto;background:var(--navy);color:#fff;padding:14px 0}nav.m .dd{background:none;color:#fff;position:static;opacity:1;visibility:visible;transform:none;box-shadow:none;border:0;padding:0 0 0 12px}
.hero .g,.split,.c3,.c2,.bk,.svc,footer .f{grid-template-columns:1fr}.steps,.stats{grid-template-columns:1fr 1fr}.arch{max-width:340px}.cta{padding:40px 26px}.rv{width:300px}.mb{padding:34px 24px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rev{opacity:1;transform:none}}
</style></head><body>
<header id="hd"><div class="w"><nav id="nv"></nav></div></header>
<main id="app"></main><footer id="ft"></footer>
<div class="md" id="md"><div class="mb" id="mb"></div></div>

/* Sample articles for testing — edit freely */
const BLOG=[
["why-software-feels-hard","Why your case management software feels harder than it should","Case Management","Oct 12, 2026",5,"Most frustration with practice software comes from setup, not the software itself.",["Most firms buy a platform, import a few contacts and start improvising. Within months every attorney has a private way of doing the same task, and nobody trusts the system.","The fix is rarely a new tool. Decide how a matter should move from open to closed, then configure the software to match that path. Once the path is written down, the screens stop feeling confusing."]],
["intake-mistakes","Five intake mistakes that cost firms clients","Intake & Clients","Oct 5, 2026",6,"A slow or unclear first contact is the cheapest way to lose a good case.",["Prospects compare firms in minutes. Long forms, no confirmation message and a week of silence tell them you are too busy for them.","Shorten the form, confirm receipt instantly, and assign every inquiry an owner and a deadline. Small changes at intake usually pay back faster than any marketing spend."]],
["workflow-automation-basics","A beginner’s guide to workflow automation for lawyers","Automation","Sep 28, 2026",7,"Automation starts with a checklist, not with a tool.",["Pick one repeated task, such as opening a new matter. Write each step in order, then mark the steps that need human judgment and the ones that do not.","Automate only the second group. A task that triggers, assigns and reminds on its own gives your team hours back without removing the attorney from decisions that matter."]],
["the-unboxing-problem","The unboxing problem: what to do after you buy new software","Case Management","Sep 21, 2026",4,"The software is paid for and untouched. Here is how to start.",["Buying the platform feels like progress, yet many subscriptions sit half configured for months. The backlog of daily work always wins.","Begin with a two-week plan: one practice area, one workflow, one template set. Finish that completely before touching anything else."]],
["document-your-processes","How to document your firm’s processes in one afternoon","Firm Operations","Sep 14, 2026",5,"You do not need a manual. You need ten honest checklists.",["Ask each team member to list what they do on a new matter, in their own words. Combine the lists and look for gaps and duplicates.","Turn the result into short checklists with an owner for each step. Review them quarterly, and they become the foundation for every system you build."]],
["choosing-case-management","Choosing between MyCase, Clio and Smokeball","Legal Tech Strategy","Sep 7, 2026",8,"The right platform depends on your practice area, team size and habits.",["Compare tools against your own workflows rather than feature lists. Ask which one makes your most frequent task fastest.","Run a short trial with a real matter, involve the person who will use it daily, and check what migration and support will cost before you commit."]],
["welcome-letters","Welcome letters that set expectations on day one","Intake & Clients","Aug 30, 2026",4,"A clear first message prevents most later misunderstandings.",["New clients want to know what happens next, who they will hear from and how long things take. Put those answers in writing at the start.","Keep the letter short, warm and specific. Send it automatically the moment an engagement is signed."]],
["three-automations","Three automations worth building first","Automation","Aug 23, 2026",6,"Start with the tasks that repeat daily and rarely change.",["New inquiry alerts, appointment reminders and client status updates are repeated constantly and follow clear rules, which makes them ideal starting points.","Build them one at a time, test with a colleague, and only then switch them on for real clients."]],
["what-an-audit-looks-like","What a systems audit actually looks like","Legal Tech Strategy","Aug 16, 2026",6,"An audit finds where time leaks out of your firm.",["We review the tools you pay for, how matters actually move, and where people copy data by hand. The goal is a ranked list, not a long report.","You leave with the three changes that will save the most time, plus a plan for sequencing them."]],
["train-your-team","Training your team so the new system actually gets used","Firm Operations","Aug 9, 2026",5,"Adoption is a leadership task, not a technical one.",["People return to old habits when the new way is slower at first. Show the benefit to them personally and give them room to practice.","Appoint a champion, hold short weekly check-ins for a month, and measure proficiency instead of assuming it."]],
["data-migration","Data migration without the dread","Case Management","Aug 2, 2026",6,"Moving from one platform to another is manageable with a plan.",["Decide what you truly need to carry over. Old, closed matters rarely need the same detail as active ones.","Clean the data before the move, test with a small batch, and keep the old system available until the team confirms everything arrived."]],
["scalable-tech-stack","Building a tech stack that scales with your caseload","Legal Tech Strategy","Jul 26, 2026",7,"Add tools slowly, and connect them before you add more.",["Every new tool adds a login, a cost and a place where information can go missing. Choose software that integrates with what you already use.","Review the stack once a year. Remove what nobody uses, and write down who owns each tool."]]
